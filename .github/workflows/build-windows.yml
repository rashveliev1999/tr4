
name: Build TrimUI Companion NX REDUX

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt pyinstaller

      - name: Run core tests
        run: python -m unittest discover -s tests -v

      - name: Build standalone EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name TrimUICompanionNX --icon TrimUICompanion.ico --add-data "TrimUICompanion.ico;." --collect-all customtkinter --collect-all PIL --collect-all paramiko --collect-all cryptography --collect-all bcrypt --collect-all nacl trimui_companion.py

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/TrimUICompanionNX.exe release/
          Copy-Item README_RU.md release/

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TrimUICompanionNX-Windows
          path: release/*
          if-no-files-found: error
